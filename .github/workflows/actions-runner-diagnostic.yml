name: Public Windows Runner Diagnostic
on:
  push:
    branches: [actions-runner-diagnostic-20261018]
    paths: ['.github/workflows/actions-runner-diagnostic.yml']
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: windows-2022
    timeout-minutes: 3
    steps:
      - name: Confirm Windows runner availability
        shell: pwsh
        run: Write-Host "PUBLIC_WINDOWS_RUNNER_OK"
